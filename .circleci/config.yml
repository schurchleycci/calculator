version: 2.1

jobs:
  diff-to-artifact:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Generate git diff
          command: |
            git fetch origin main
            git diff origin/main...HEAD > /tmp/branch.diff
      - store_artifacts:
          path: /tmp/branch.diff
          destination: branch.diff

workflows:
  my-workflow:
    jobs:
      - diff-to-artifact
      - hold:
          type: approval
          requires:
            - diff-to-artifact
